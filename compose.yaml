include:
  - proxy.yaml

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    image: netology-web
    restart: always
    networks:
        backend:
          ipv4_address: 172.20.0.5
    env_file:
      - .env-web


  db:
    image: mysql:8
    restart: always
    networks:
        backend:
          ipv4_address: 172.20.0.10
    env_file:
      - .env-db
      
